<!DOCTYPE html>
<html>
<head>
    <title>Test Manual Dropdown</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3>Test Manual Dropdown Komponen</h3>
        
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="ro_test" class="form-label">RO</label>
                <select class="form-select" id="ro_test">
                    <option value="">-- Pilih RO --</option>
                    <option value="1">1 - Layanan BMN</option>
                    <option value="2">2 - Layanan Umum</option>
                </select>
            </div>
            
            <div class="col-md-4">
                <label for="komponen_test" class="form-label">Komponen</label>
                <select class="form-select" id="komponen_test">
                    <option value="">-- Pilih Komponen --</option>
                </select>
            </div>
        </div>
        
        <div class="mb-3">
            <button onclick="testManual()" class="btn btn-primary">Test Manual Load</button>
            <button onclick="clearLog()" class="btn btn-secondary">Clear Log</button>
        </div>
        
        <div id="log" style="background: #f8f9fa; padding: 10px; height: 300px; overflow-y: scroll; font-family: monospace; font-size: 12px;"></div>
    </div>

    <script>
        const baseUrl = 'http://localhost:8080/';
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function testManual() {
            const roSelect = document.getElementById('ro_test');
            const komponenSelect = document.getElementById('komponen_test');
            const roId = roSelect.value;
            
            log(`=== Testing Manual Load ===`);
            log(`RO ID: ${roId}`);
            
            if (!roId) {
                log('ERROR: Please select RO first');
                return;
            }
            
            try {
                const url = `${baseUrl}ajaxcontroller/komponen/${roId}`;
                log(`Fetching: ${url}`);
                
                const response = await fetch(url);
                log(`Response status: ${response.status}`);
                log(`Response ok: ${response.ok}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                log(`Data received: ${JSON.stringify(data)}`);
                
                // Clear komponen dropdown
                komponenSelect.innerHTML = '<option value="">-- Pilih Komponen --</option>';
                
                if (Array.isArray(data) && data.length > 0) {
                    data.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;
                        option.textContent = `${item.kode_komponen} - ${item.nama_komponen}`;
                        komponenSelect.appendChild(option);
                        log(`Added option: ${option.textContent}`);
                    });
                    log(`SUCCESS: Loaded ${data.length} komponen options`);
                } else {
                    log('WARNING: No data received or data is empty');
                }
                
            } catch (error) {
                log(`ERROR: ${error.message}`);
            }
        }
        
        // Auto setup event listener
        document.getElementById('ro_test').addEventListener('change', function() {
            if (this.value) {
                log(`RO changed to: ${this.value}`);
                testManual();
            } else {
                document.getElementById('komponen_test').innerHTML = '<option value="">-- Pilih Komponen --</option>';
                log('RO cleared, komponen reset');
            }
        });
        
        log('=== Test page loaded ===');
    </script>
</body>
</html>
